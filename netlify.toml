# Static site, no build step. Keeps working-files out of Git-based deploys.
[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/_archive/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_build/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
